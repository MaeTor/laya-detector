[project]
name = "laya-detector"
version = "0.1.0"
description = "Evidence-consistency checker: calibrated contradiction and evasion scores with decider-2b"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "decider-ai>=1.5",
    "faster-whisper",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "typer",
    "python-dotenv",
]

[project.scripts]
laya = "laya.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya"]
